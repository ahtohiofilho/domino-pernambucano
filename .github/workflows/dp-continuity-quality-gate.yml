name: DP Continuity Quality Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dp-continuity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM full unit test suite
        run: bash ./gradlew :game-core:test :server:test :miniproduction-client:test --stacktrace
      - name: Publish JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-jvm-test-reports
          path: |
            **/build/test-results/test/**/*.xml
            **/build/reports/tests/test/**
          if-no-files-found: ignore

  android-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install target Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "Android SDK manager unavailable"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android debug unit tests and lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Publish Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-android-test-reports
          path: |
            app/build/test-results/**/*.xml
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  synthetic-image-build-preflight:
    name: Synthetic image build (no push, no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request default checks out GitHub's synthetic merge commit.
          # Pin the artifact to the exact reviewed head SHA instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restrict container build context
        run: cp Dockerfile.synthetic-population.dockerignore .dockerignore
      - name: Build candidate image without credentials or registry publishing
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          image="dp-synthetic:sha-${sha:0:12}"
          docker build --file Dockerfile.synthetic-population --tag "$image" .
      - name: Verify image runtime contract offline
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          image="dp-synthetic:sha-${sha:0:12}"
          user=$(docker image inspect --format '{{.Config.User}}' "$image")
          test "$user" = '10002:10002'
          ports=$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$image")
          test "$ports" = 'null' || test "$ports" = '{}'
          entry=$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image")
          test "$entry" = '["/opt/domino-synthetic/bin/miniproduction-client"]'
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = 'linux/amd64'
          docker run --rm --network none --entrypoint /bin/sh "$image" \
            -c 'test -x /opt/domino-synthetic/bin/miniproduction-client && test -d /state'
          echo 'SYNTHETIC_IMAGE_BUILD_PREFLIGHT=PASS'
          echo 'REGISTRY_PUSH=NONE'
          echo 'PRODUCTION_CHANGES=NONE'
      - name: Export integrity-checked candidate for controlled AWS staging
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          image="dp-synthetic:sha-${sha:0:12}"
          mkdir -p dist
          archive="dp-synthetic-${sha:0:12}.docker.tar.gz"
          docker save "$image" | gzip -n -1 > "dist/$archive"
          gzip -t "dist/$archive"
          {
            printf 'SOURCE_COMMIT=%s\n' "$sha"
            printf 'IMAGE_TAG=%s\n' "$image"
            printf 'IMAGE_ID=%s\n' "$(docker image inspect --format '{{.Id}}' "$image")"
            printf 'IMAGE_PLATFORM=%s\n' "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
          } > dist/manifest.txt
          ( cd dist && sha256sum "$archive" > SHA256SUMS )
          echo 'CANDIDATE_ARCHIVE_VERIFIED=PASS'
          echo 'NO_AWS_OR_REGISTRY_DEPLOY=PASS'
      - name: Verify archived image using the staging PowerShell contract
        shell: pwsh
        run: |
          & ./scripts/Stage-DPSyntheticCandidate.ps1 -ArtifactDirectory ./dist
      - name: Publish immutable build candidate artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: dp-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  release-readiness-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell operational scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
              'scripts/Invoke-DPReleaseReadiness.ps1',
              'scripts/Release-DominoPE.ps1',
              'scripts/Invoke-DPContinuityQa.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PS_PARSE_FAILED=$script"
            }
          }
      - name: Execute safe offline release readiness check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path (Join-Path $HOME 'Downloads') | Out-Null
          & .\scripts\Invoke-DPReleaseReadiness.ps1 -SkipRemote
      - name: Verify SSH Bash payload on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Invoke-DPReleaseReadiness.ps1 -CheckTransportOnly
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
            throw 'POWERSHELL51_REMOTE_PAYLOAD_CHECK_FAILED'
          }

  android-instrumentation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "Android SDK manager unavailable"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Publish instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
